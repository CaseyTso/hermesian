name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Obsidian plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e '
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expected = `v${manifest.version}`;
          if (process.env.TAG_NAME !== expected || pkg.version !== manifest.version) {
            throw new Error(`Version mismatch: tag=${process.env.TAG_NAME}, manifest=${manifest.version}, package=${pkg.version}`);
          }
          '

      - name: Verify and build
        run: npm run verify

      - name: Package installable artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cd release
          zip -9 "../hermesian-${TAG_NAME}.zip" main.js manifest.json styles.css

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="hermesian-${TAG_NAME}.zip"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" main.js manifest.json styles.css "${archive}" --clobber
          else
            gh release create "${TAG_NAME}" \
              --verify-tag \
              --title "Hermesian ${TAG_NAME#v}" \
              --generate-notes \
              main.js manifest.json styles.css "${archive}"
          fi
